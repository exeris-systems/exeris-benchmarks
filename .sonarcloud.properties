# SonarCloud analysis scope.
#
# NOTE ON FILENAME: this project uses SonarCloud Automatic Analysis, which reads
# `.sonarcloud.properties`. A `sonar-project.properties` file would be silently ignored here — it
# applies only to CI/scanner-based analysis.
#
# WHAT THIS DOES: points the scanner at the code it is calibrated for. This repository is a
# benchmark lab, not a product — CLAUDE.md: "not a guard-test repo and does not gate merges into
# product repositories." The excluded paths are benchmark ORCHESTRATION and measurement DATA:
#
#   scripts/ tools/ scenarios/ runtime/   bash harnesses, drivers and compose fixtures
#   results/                              committed raw measurement output (data, not code)
#
# WHAT THIS IS NOT: a blanket suppression to turn a gate green. The application code stays fully
# analysed and is where a security finding would actually matter:
#
#   targets/    the Java benchmark apps, incl. JWT issuance and bearer-token handling
#   micro/      JMH microbenchmarks
#   .github/    workflows
#
# Those currently report 0 security and 0 reliability issues; every finding on the branch that
# prompted this change sat in the excluded orchestration paths. Scoping the scanner this way means a
# genuine issue in a target app stays visible instead of being buried under fixture noise.
#
# WHY THE EXCLUDED PATHS WERE NOISY: their security findings are hardcoded-credential detections on
# benchmark fixtures — a throwaway loopback PostgreSQL container whose password is literally
# "benchmark", torn down after each run. Rewriting those to indirection would satisfy the tool
# without improving security, and would introduce an "unset variable -> silently wrong DB config"
# failure mode into the exact strings the comparative fairness gate now fingerprints and fails closed
# on (scripts/run-comparative.sh). That trade is bad for a harness whose value is that its
# configuration is deterministic and auditable.
#
# Note also that scripts/ and tools/ contribute no counted lines of code (shell is not a counted
# language here; their findings come from the cross-language secrets/text analyzers), so excluding
# them loses no measured surface.
#
# If shell coverage is ever wanted back, prefer a narrower fix over deleting these lines:
# Administration -> Analysis Scope -> "Ignore Issues on Multiple Criteria", silencing only the
# credential rule on these paths.

sonar.exclusions=scripts/**,tools/**,scenarios/**,runtime/**,results/**
