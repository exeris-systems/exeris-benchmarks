<text x="64" y="92" font-size="20" fill="#60a5fa" letter-spacing="3">PERFORMANCE · BENCHMARKING · JVM</text>
<text x="64" y="168" font-size="52" font-weight="bold" fill="#f8fafc">The workload picks the margin</text>
<text x="64" y="214" font-size="26" fill="#cbd5e1">— the config picked the winner</text>
<text x="64" y="248" font-size="26" fill="#cbd5e1">a gate-passing cross-runtime triad on bare metal</text>
<text x="64" y="312" font-size="17" fill="#94a3b8">entity-read-by-id · Exeris (Community) vs Quarkus-tuned vs Quarkus+Hibernate · h1 cleartext loopback · JDK 26 · perf-box-amd64</text>
<rect x="64" y="344" width="200" height="60" rx="6" fill="#1d4ed8" opacity="0.18" stroke="#3b82f6" stroke-width="1"/><text x="80" y="370" font-size="12" fill="#93c5fd">light: throughput</text><text x="80" y="394" font-size="16" font-weight="bold" fill="#f8fafc">+39% / +57%</text>
<rect x="282" y="344" width="200" height="60" rx="6" fill="#1d4ed8" opacity="0.18" stroke="#3b82f6" stroke-width="1"/><text x="298" y="370" font-size="12" fill="#93c5fd">heavy: default → normalized</text><text x="298" y="394" font-size="16" font-weight="bold" fill="#f8fafc">−10% → +6% vs tuned</text>
<rect x="500" y="344" width="200" height="60" rx="6" fill="#1d4ed8" opacity="0.18" stroke="#3b82f6" stroke-width="1"/><text x="516" y="370" font-size="12" fill="#93c5fd">RSS, both workloads</text><text x="516" y="394" font-size="16" font-weight="bold" fill="#f8fafc">~1/2.7 – 1/2.9</text>
<rect x="718" y="344" width="200" height="60" rx="6" fill="#1d4ed8" opacity="0.18" stroke="#3b82f6" stroke-width="1"/><text x="734" y="370" font-size="12" fill="#93c5fd">startup → 1st request</text><text x="734" y="394" font-size="16" font-weight="bold" fill="#f8fafc">1.15 s vs 2.2–2.4 s</text>
<rect x="936" y="344" width="200" height="60" rx="6" fill="#1d4ed8" opacity="0.18" stroke="#3b82f6" stroke-width="1"/><text x="952" y="370" font-size="12" fill="#93c5fd">strict gate</text><text x="952" y="394" font-size="16" font-weight="bold" fill="#f8fafc">12/12 eligible</text>
