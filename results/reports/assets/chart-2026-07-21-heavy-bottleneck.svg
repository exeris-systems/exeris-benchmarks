<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Verdana,Helvetica,sans-serif" role="img" aria-label="Heavy contract: target vs Postgres cpuset utilization per stack">
<rect width="1200" height="420" fill="#0f172a"/>
<text x="24" y="34" font-size="17" font-weight="bold" fill="#f8fafc">DB-bound aggregate — Postgres is the ceiling for every stack</text>
<text x="24" y="54" font-size="11" fill="#94a3b8">fixed_contract_cross_runtime_h1_v2 · GET /api/v1/users (10×10×10, ~9.2 KB, 3 queries/req) · per-cpuset busy% from sar over each 900 s window · mean of 4 legs</text>
<rect x="24" y="72" width="14" height="14" rx="3" fill="#3987e5"/><text x="44" y="84" font-size="12" fill="#cbd5e1">target cpuset (4 vCPU: 0-1,8-9)</text><rect x="300" y="72" width="14" height="14" rx="3" fill="#d55181"/><text x="320" y="84" font-size="12" fill="#cbd5e1">Postgres cpuset (8 vCPU: 4-7,12-15)</text>
<line x1="174.0" y1="116" x2="174.0" y2="356" stroke="#334155" stroke-width="1"/><text x="174.0" y="374" font-size="10" fill="#94a3b8" text-anchor="middle">0%</text>
<line x1="386.5" y1="116" x2="386.5" y2="356" stroke="#334155" stroke-width="1"/><text x="386.5" y="374" font-size="10" fill="#94a3b8" text-anchor="middle">25%</text>
<line x1="599.0" y1="116" x2="599.0" y2="356" stroke="#334155" stroke-width="1"/><text x="599.0" y="374" font-size="10" fill="#94a3b8" text-anchor="middle">50%</text>
<line x1="811.5" y1="116" x2="811.5" y2="356" stroke="#334155" stroke-width="1"/><text x="811.5" y="374" font-size="10" fill="#94a3b8" text-anchor="middle">75%</text>
<line x1="1024.0" y1="116" x2="1024.0" y2="356" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/><text x="1024.0" y="374" font-size="10" fill="#94a3b8" text-anchor="middle">100%</text>
<text x="1024.0" y="108" font-size="10" fill="#94a3b8" text-anchor="middle">saturation</text>
<text x="164" y="158" font-size="12" fill="#cbd5e1" text-anchor="end">exeris-community</text><text x="164" y="173" font-size="10" fill="#94a3b8" text-anchor="end">11 621 rps¹</text><path d="M175,130 h704.9 q4,0 4,4 v18 q0,4 -4,4 h-704.9 z" fill="#3987e5" opacity="1.0"/><text x="874.9" y="147.0" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">83%</text><path d="M175,158 h812.9 q4,0 4,4 v18 q0,4 -4,4 h-812.9 z" fill="#d55181" opacity="1.0"/><text x="982.9" y="175.0" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">96%</text>
<text x="164" y="240" font-size="12" fill="#cbd5e1" text-anchor="end">quarkus-tuned</text><text x="164" y="255" font-size="10" fill="#94a3b8" text-anchor="end">12 973 rps</text><path d="M175,212 h670.9 q4,0 4,4 v18 q0,4 -4,4 h-670.9 z" fill="#3987e5" opacity="1.0"/><text x="840.9" y="229.0" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">79%</text><path d="M175,240 h835.8 q4,0 4,4 v18 q0,4 -4,4 h-835.8 z" fill="#d55181" opacity="1.0"/><text x="1005.8" y="257.0" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">99%</text>
<text x="164" y="322" font-size="12" fill="#cbd5e1" text-anchor="end">quarkus-hibernate</text><text x="164" y="337" font-size="10" fill="#94a3b8" text-anchor="end">10 989 rps</text><path d="M175,294 h798.4 q4,0 4,4 v18 q0,4 -4,4 h-798.4 z" fill="#3987e5" opacity="1.0"/><text x="968.4" y="311.0" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">94%</text><path d="M175,322 h781.4 q4,0 4,4 v18 q0,4 -4,4 h-781.4 z" fill="#d55181" opacity="1.0"/><text x="951.4" y="339.0" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">92%</text>
<text x="24" y="390" font-size="10" fill="#94a3b8">¹ Exeris heavy mean includes the campaign's first-ever leaf (10 882 rps, coldest DB caches); its other three legs sit at 11 797–11 916. Postgres cpuset 92–99.5% busy in every leg — throughput here measures</text>
<text x="24" y="404" font-size="10" fill="#94a3b8">what each stack extracts from a saturated shared DB, not raw runtime efficiency. quarkus-tuned also costs Postgres the least per request (~600 µs vs ~660/675 µs of PG CPU, identical SQL).</text>
</svg>
