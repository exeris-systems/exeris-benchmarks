<text x="156.0" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">0</text>
<line x1="264.3" y1="110" x2="264.3" y2="280" stroke="#334155" stroke-width="1"/>
<text x="264.3" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">400</text>
<line x1="372.6" y1="110" x2="372.6" y2="280" stroke="#334155" stroke-width="1"/>
<text x="372.6" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">800</text>
<line x1="480.9" y1="110" x2="480.9" y2="280" stroke="#334155" stroke-width="1"/>
<text x="480.9" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">1,200</text>
<line x1="156" y1="110" x2="156" y2="280" stroke="#94a3b8" stroke-width="1"/>
<text x="148" y="150.5" font-size="12" fill="#cbd5e1" text-anchor="end">exeris-community</text>
<path d="M157,134.5 h103.5 q4,0 4,4 v16 q0,4 -4,4 h-103.5 z" fill="#3987e5" opacity="1.0"/>
<text x="272.5" y="150.5" font-size="12" font-weight="bold" fill="#f8fafc">397</text>
<text x="272.5" y="163.5" font-size="9" fill="#94a3b8">374–441 MB across 8 legs</text>
<text x="148" y="199.0" font-size="12" fill="#cbd5e1" text-anchor="end">quarkus-tuned</text>
<path d="M157,183.0 h279.8 q4,0 4,4 v16 q0,4 -4,4 h-279.8 z" fill="#3987e5" opacity="1.0"/>
<text x="448.8" y="199.0" font-size="12" font-weight="bold" fill="#f8fafc">1,048</text>
<text x="448.8" y="212.0" font-size="9" fill="#94a3b8">1 041–1 057</text>
<text x="148" y="247.5" font-size="12" fill="#cbd5e1" text-anchor="end">quarkus-hibernate</text>
<path d="M157,231.5 h309.6 q4,0 4,4 v16 q0,4 -4,4 h-309.6 z" fill="#3987e5" opacity="1.0"/>
<text x="478.6" y="247.5" font-size="12" font-weight="bold" fill="#f8fafc">1,158</text>
<text x="478.6" y="260.5" font-size="9" fill="#94a3b8">1 106–1 234</text><text x="624" y="76" font-size="15" font-weight="bold" fill="#f8fafc">Startup → first served request</text>
<text x="624" y="94" font-size="11" fill="#94a3b8">seconds (n=4 launches, max spread 17 ms) — lower is better</text>
<line x1="756.0" y1="110" x2="756.0" y2="280" stroke="#334155" stroke-width="1"/>
<text x="756.0" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">0</text>
<line x1="891.4" y1="110" x2="891.4" y2="280" stroke="#334155" stroke-width="1"/>
<text x="891.4" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">1</text>
<line x1="1026.8" y1="110" x2="1026.8" y2="280" stroke="#334155" stroke-width="1"/>
<text x="1026.8" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">2</text>
<line x1="756" y1="110" x2="756" y2="280" stroke="#94a3b8" stroke-width="1"/>
<text x="748" y="150.5" font-size="12" fill="#cbd5e1" text-anchor="end">exeris-community</text>
<path d="M757,134.5 h151.7 q4,0 4,4 v16 q0,4 -4,4 h-151.7 z" fill="#3987e5" opacity="1.0"/>
<text x="920.7" y="150.5" font-size="12" font-weight="bold" fill="#f8fafc">1.15 s</text>
<text x="748" y="199.0" font-size="12" fill="#cbd5e1" text-anchor="end">quarkus-tuned</text>
<path d="M757,183.0 h300.6 q4,0 4,4 v16 q0,4 -4,4 h-300.6 z" fill="#3987e5" opacity="1.0"/>
