<text x="748" y="247.5" font-size="12" fill="#cbd5e1" text-anchor="end">quarkus-hibernate</text>
<path d="M757,231.5 h323.6 q4,0 4,4 v16 q0,4 -4,4 h-323.6 z" fill="#3987e5" opacity="1.0"/>
<text x="1092.6" y="247.5" font-size="12" font-weight="bold" fill="#f8fafc">2.42 s</text>
<text x="24" y="312" font-size="10" fill="#94a3b8">Budget-matched (not -Xmx-matched) fairness model: same 2 GiB slice per stack, heap split per stack profile. Cost side: Exeris young-GC 6.4/s × ~1.8 ms on the heavy contract (≈1.2% of wall)</text>
<text x="24" y="326" font-size="10" fill="#94a3b8">vs ~1.8–3.7/s × ~3 ms for the Quarkus targets. JVM mode; a native Quarkus build is a different (smaller) story.</text>
</svg>
