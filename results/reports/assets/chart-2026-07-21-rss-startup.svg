<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Verdana,Helvetica,sans-serif" role="img" aria-label="Steady-state RSS and startup time per target">
<rect width="1200" height="340" fill="#0f172a"/>
<text x="24" y="34" font-size="17" font-weight="bold" fill="#f8fafc">Footprint and startup — the axis the workload does not flip</text>
<text x="24" y="54" font-size="11" fill="#94a3b8">equal 2 GiB per-target budget (-XX:MaxRAM=2048m) · Exeris heap 256 MB, Quarkus heaps 1280 MB (-Xms=-Xmx) · RSS = process RSS avg over the 900 s window, both contracts pooled</text>
<text x="24" y="76" font-size="15" font-weight="bold" fill="#f8fafc">Steady-state RSS under load</text>
<text x="24" y="94" font-size="11" fill="#94a3b8">MB resident — lower is better</text>
