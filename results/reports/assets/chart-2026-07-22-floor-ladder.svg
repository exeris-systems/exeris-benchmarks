<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Verdana,Helvetica,sans-serif" role="img" aria-label="Memory floor search ladders, 2 by 2">
<rect width="1200" height="470" fill="#0f172a"/>
<text x="24" y="34" font-size="17" font-weight="bold" fill="#f8fafc">Memory floors — the 2×2 search ladders (fixed 1 000 rps, open-loop wrk2, 4 vCPU)</text>
<text x="24" y="54" font-size="11" fill="#94a3b8">binary search, n=1 per grid step, 16–32 MiB grid · loadgen escaped to a sibling slice (83f88e1) · tuned-PG external · post-fence jars · track-c, descriptive only</text>
<circle cx="30" cy="76" r="5.5" fill="#cbd5e1"/><text x="42" y="80" font-size="11" fill="#cbd5e1">ok — serves the window and survives</text><circle cx="290" cy="76" r="5.5" fill="none" stroke="#cbd5e1" stroke-width="2"/><path d="M284.5,76 a5.5,5.5 0 0 1 11,0 z" fill="#cbd5e1"/><text x="302" y="80" font-size="11" fill="#cbd5e1">serves 1 000 rps, then oomd (rc 143) — below floor</text><path d="M648,70 l12,12 M660,70 l-12,12" stroke="#94a3b8" stroke-width="2.5"/><text x="668" y="80" font-size="11" fill="#cbd5e1">does not boot (OOM at readiness)</text><line x1="944" y1="76" x2="976" y2="76" stroke="#f8fafc" stroke-width="3"/><text x="984" y="80" font-size="11" fill="#cbd5e1">floor</text>
