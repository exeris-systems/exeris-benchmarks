<text x="24" y="440" font-size="10" fill="#94a3b8">All four columns also pass at the 512 MiB anchor (off scale). TLS shifts the exeris 112 MiB cell from "serves-then-dies" to "does not boot" — the crypto startup tax exists but is smaller than one 16 MiB grid step</text>
<text x="24" y="454" font-size="10" fill="#94a3b8">(campaign estimate: within n=1 startup noise, ~±7 MiB). Floors are MemoryMax grid values under strict verdicts ("serves but does not survive" = fail), not continuous measurements.</text>
</svg>
