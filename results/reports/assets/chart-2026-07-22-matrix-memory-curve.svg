<text x="700.0" y="376.0" font-size="11" font-weight="bold" fill="#008300" text-anchor="middle">OOM</text><text x="24" y="426" font-size="10" fill="#94a3b8">Exeris runs full-speed inside a 128 MiB budget (process RSS reads ~136 MB — shared/file pages counted per-process; the cgroup charges them once: measured charge ≈118.7 MiB, inside the cap;</text>
<text x="24" y="440" font-size="10" fill="#94a3b8">the cap held for the full window). quarkus-tuned (heap 0.75×budget = 96 MiB at 128m) OOMs at readiness in 3/3 repeats — and at 160 MiB in the floor experiment.</text>
<text x="24" y="454" font-size="10" fill="#94a3b8">PG runs outside the budget on its own cpuset (~48 MB RSS). Levels are NOT comparable to the report body (different windows, GC, pool, cgroup scope, subsystems).</text>
