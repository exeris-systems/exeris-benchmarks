<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="Verdana,Helvetica,sans-serif" role="img" aria-label="Connection-pool sweep at 1 GiB / 4 vCPU: throughput and CPU per request vs pool size">
<rect width="1200" height="460" fill="#0f172a"/>
<text x="24" y="34" font-size="17" font-weight="bold" fill="#f8fafc">Connection-pool sweep — 1 GiB / 4 vCPU, pool min=max ∈ {4,8,16,32}, equalized builds</text>
<text x="24" y="54" font-size="11" fill="#94a3b8">medians of 3 interleaved repeats · 24/24 runs clean, 0 errors · post-equalization jars (9f2b182 pgjdbc params, 1bf4767 admission ratio=32) · track-c, descriptive only</text>
<rect x="24" y="70" width="14" height="14" rx="3" fill="#3987e5"/><text x="44" y="82" font-size="12" fill="#cbd5e1">exeris-community</text><rect x="240" y="70" width="14" height="14" rx="3" fill="#008300"/><text x="260" y="82" font-size="12" fill="#cbd5e1">quarkus-tuned</text>
