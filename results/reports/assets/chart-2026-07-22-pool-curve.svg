<circle cx="993.3" cy="245.4" r="4.5" fill="#008300" stroke="#0f172a" stroke-width="2"/>
<text x="993.3" y="235.4" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">70</text>
<circle cx="1140.0" cy="250.8" r="4.5" fill="#008300" stroke="#0f172a" stroke-width="2"/>
<text x="1140.0" y="240.8" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">67</text>
<text x="24" y="416" font-size="10" fill="#94a3b8">Exeris reaches its own ceiling (~56–57k) with 8 connections and stays flat at 54 µs/req; quarkus-tuned needs 16–32 connections to reach its ~47–48k ceiling. This is NOT DB saturation —</text>
<text x="24" y="430" font-size="10" fill="#94a3b8">Postgres sits at ~40% of its cpuset with ~51 MB RSS (outside the app budget). Pool 4 starves both arms (admission queueing shows up as +cpu/req for both).</text>
<text x="24" y="444" font-size="10" fill="#94a3b8">Levels are not mixable with the memory×CPU matrix above (pre-fence jars) nor with the triad report (different windows/GC/pool/scope).</text>
</svg>
