<text x="1075.2" y="279.2" font-size="12" font-weight="bold" fill="#f8fafc">73.1</text><text x="24" y="342" font-size="10" fill="#94a3b8">TLS tax: exeris −12.8% rps / +12.7% CPU-per-req / +24 MB RSS (crypto subsystem loads only for TLS) · quarkus-tuned −8.1% / +5.8% / ~0 MB (tcnative always resident in its ~457 MB base).</text>
<text x="24" y="356" font-size="10" fill="#94a3b8">Added CPU per request: +6.9 µs (OffHeapTlsEngine) vs +4.0 µs (BoringSSL) — exeris pays ~73% more added cost per request; it still leads every absolute axis under TLS</text>
<text x="24" y="370" font-size="10" fill="#94a3b8">(49.4k vs 43.4k rps, 60.9 vs 73.1 µs/req, ~248 vs ~457 MB RSS). Same certificate both arms; engines differ by design — each stack&apos;s own TLS cost, not a shared-provider comparison.</text>
