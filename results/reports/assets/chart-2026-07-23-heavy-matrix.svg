<line x1="60" y1="380.0" x2="580" y2="380.0" stroke="#334155" stroke-width="1"/><text x="54" y="384.0" font-size="10" fill="#94a3b8" text-anchor="end">0</text><line x1="60" y1="322.5" x2="580" y2="322.5" stroke="#334155" stroke-width="1"/><text x="54" y="326.5" font-size="10" fill="#94a3b8" text-anchor="end">200</text><line x1="60" y1="265.0" x2="580" y2="265.0" stroke="#334155" stroke-width="1"/><text x="54" y="269.0" font-size="10" fill="#94a3b8" text-anchor="end">400</text><line x1="60" y1="207.5" x2="580" y2="207.5" stroke="#334155" stroke-width="1"/><text x="54" y="211.5" font-size="10" fill="#94a3b8" text-anchor="end">600</text><line x1="60" y1="150.0" x2="580" y2="150.0" stroke="#334155" stroke-width="1"/><text x="54" y="154.0" font-size="10" fill="#94a3b8" text-anchor="end">800</text><text x="100.0" y="398" font-size="11" fill="#cbd5e1" text-anchor="middle">128m</text><text x="210.0" y="398" font-size="11" fill="#cbd5e1" text-anchor="middle">256m</text><text x="320.0" y="398" font-size="11" fill="#cbd5e1" text-anchor="middle">512m</text><text x="430.0" y="398" font-size="11" fill="#cbd5e1" text-anchor="middle">1024m</text><text x="540.0" y="398" font-size="11" fill="#cbd5e1" text-anchor="middle">2048m</text><text x="60" y="134" font-size="13" font-weight="bold" fill="#f8fafc">Peak RSS vs budget (MB) — the gap that does NOT converge</text><text x="60" y="148" font-size="10" fill="#94a3b8">throughput (rps, next to point) is flat ~13.4–13.8k for both · × = OOM below floor</text><path d="M210.0,325.1 L320.0,313.0 L430.0,305.8 L540.0,287.7" fill="none" stroke="#3987e5" stroke-width="2"/><circle cx="210.0" cy="325.1" r="4.5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="210.0" y="316.1" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">191</text><text x="210.0" y="341.1" font-size="8" fill="#94a3b8" text-anchor="middle">13.5k</text><circle cx="320.0" cy="313.0" r="4.5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="320.0" y="304.0" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">233</text><text x="320.0" y="329.0" font-size="8" fill="#94a3b8" text-anchor="middle">13.6k</text><circle cx="430.0" cy="305.8" r="4.5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="430.0" y="296.8" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">258</text><text x="430.0" y="321.8" font-size="8" fill="#94a3b8" text-anchor="middle">13.8k</text><circle cx="540.0" cy="287.7" r="4.5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="540.0" y="278.7" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">321</text><text x="540.0" y="303.7" font-size="8" fill="#94a3b8" text-anchor="middle">13.8k</text><path d="M320.0,283.1 L430.0,247.8 L540.0,171.0" fill="none" stroke="#008300" stroke-width="2"/><circle cx="320.0" cy="283.1" r="4.5" fill="#008300" stroke="#0f172a" stroke-width="2"/><text x="320.0" y="274.1" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">337</text><text x="320.0" y="299.1" font-size="8" fill="#94a3b8" text-anchor="middle">13.4k</text><circle cx="430.0" cy="247.8" r="4.5" fill="#008300" stroke="#0f172a" stroke-width="2"/><text x="430.0" y="238.8" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">460</text><text x="430.0" y="263.8" font-size="8" fill="#94a3b8" text-anchor="middle">13.3k</text><circle cx="540.0" cy="171.0" r="4.5" fill="#008300" stroke="#0f172a" stroke-width="2"/><text x="540.0" y="162.0" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">727</text><text x="540.0" y="187.0" font-size="8" fill="#94a3b8" text-anchor="middle">13.4k</text><path d="M88.0,367 l10,10 M98.0,367 l-10,10" stroke="#3987e5" stroke-width="2.5"/><path d="M102.0,367 l10,10 M112.0,367 l-10,10" stroke="#008300" stroke-width="2.5"/><path d="M212.0,367 l10,10 M222.0,367 l-10,10" stroke="#008300" stroke-width="2.5"/><text x="100.0" y="360.0" font-size="8" fill="#94a3b8" text-anchor="middle">both OOM</text><text x="226.0" y="360.0" font-size="8" fill="#008300" text-anchor="middle">qt OOM</text><line x1="680" y1="380.0" x2="1200" y2="380.0" stroke="#334155" stroke-width="1"/><text x="674" y="384.0" font-size="10" fill="#94a3b8" text-anchor="end">0k</text><line x1="680" y1="322.5" x2="1200" y2="322.5" stroke="#334155" stroke-width="1"/><text x="674" y="326.5" font-size="10" fill="#94a3b8" text-anchor="end">4k</text><line x1="680" y1="265.0" x2="1200" y2="265.0" stroke="#334155" stroke-width="1"/><text x="674" y="269.0" font-size="10" fill="#94a3b8" text-anchor="end">8k</text><line x1="680" y1="207.5" x2="1200" y2="207.5" stroke="#334155" stroke-width="1"/><text x="674" y="211.5" font-size="10" fill="#94a3b8" text-anchor="end">12k</text><line x1="680" y1="150.0" x2="1200" y2="150.0" stroke="#334155" stroke-width="1"/><text x="674" y="154.0" font-size="10" fill="#94a3b8" text-anchor="end">16k</text><text x="720.0" y="398" font-size="11" fill="#cbd5e1" text-anchor="middle">2 vCPU</text><text x="940.0" y="398" font-size="11" fill="#cbd5e1" text-anchor="middle">4 vCPU</text><text x="1160.0" y="398" font-size="11" fill="#cbd5e1" text-anchor="middle">8 vCPU</text><text x="680" y="134" font-size="13" font-weight="bold" fill="#f8fafc">Throughput vs vCPU quota @1 GiB — no gain past 4</text><text x="680" y="148" font-size="10" fill="#94a3b8">throttle % labeled · 8 vCPU: loadgen shares the DB cpuset (confound)</text><path d="M720.0,218.8 L940.0,181.7 L1160.0,189.1" fill="none" stroke="#3987e5" stroke-width="2"/><circle cx="720.0" cy="218.8" r="4.5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="720.0" y="209.8" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">11.2k</text><circle cx="940.0" cy="181.7" r="4.5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="940.0" y="172.7" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">13.8k</text><circle cx="1160.0" cy="189.1" r="4.5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="1160.0" y="180.1" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">13.3k</text><path d="M720.0,239.4 L940.0,188.3 L1160.0,193.6" fill="none" stroke="#008300" stroke-width="2"/><circle cx="720.0" cy="239.4" r="4.5" fill="#008300" stroke="#0f172a" stroke-width="2"/><text x="720.0" y="257.4" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">9.8k</text><circle cx="940.0" cy="188.3" r="4.5" fill="#008300" stroke="#0f172a" stroke-width="2"/><text x="940.0" y="206.3" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">13.3k</text><circle cx="1160.0" cy="193.6" r="4.5" fill="#008300" stroke="#0f172a" stroke-width="2"/><text x="1160.0" y="211.6" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">13.0k</text><text x="720.0" y="374.0" font-size="9" fill="#c77d0a" text-anchor="middle">98%</text><text x="940.0" y="374.0" font-size="9" fill="#c77d0a" text-anchor="middle">1%</text><text x="1160.0" y="374.0" font-size="9" fill="#c77d0a" text-anchor="middle">0%</text><text x="1160.0" y="156.0" font-size="8" fill="#94a3b8" text-anchor="middle">load∥DB</text><text x="24" y="440" font-size="10" fill="#94a3b8">Both tuned runtimes converge at ~13.4 k (DB ceiling — the two window-joins cost ~0.45 ms DB-exec/req, exceeding ~0.21–0.24 ms app-CPU/req); exeris holds it on ~0.56× the RSS and −11% CPU/req.</text>
<text x="24" y="454" font-size="10" fill="#94a3b8">Aggregate floors (exeris &gt;128m, quarkus &gt;256m) are higher than the single-read floors (128/192m) — the aggregate buffers rows + a 10× larger response. Levels not mixable with the single-read matrix.</text>
</svg>
