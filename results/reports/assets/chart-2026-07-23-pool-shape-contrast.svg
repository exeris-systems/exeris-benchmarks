<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Verdana,Helvetica,sans-serif" role="img" aria-label="Pool shape contrast">
<rect width="1100" height="470" fill="#0f172a"/>
<text x="24" y="34" font-size="17" font-weight="bold" fill="#f8fafc">The workload picks the bottleneck — pool sweep, same axis, opposite shape</text>
<text x="24" y="54" font-size="11" fill="#94a3b8">exeris-community, n=3 means, each workload normalized to its OWN peak throughput · 1 GiB / 4 vCPU · track-c, descriptive</text>
<rect x="24" y="70" width="14" height="14" rx="3" fill="#d55181"/><text x="44" y="82" font-size="12" fill="#cbd5e1">single-read /api/v1/user?id=1 — runtime-bound (plateau)</text><rect x="470" y="70" width="14" height="14" rx="3" fill="#3987e5"/><text x="490" y="82" font-size="12" fill="#cbd5e1">aggregate /api/v1/users 10×10×10 — DB-bound (inverted-U)</text>
<line x1="70" y1="390.0" x2="1050" y2="390.0" stroke="#334155" stroke-width="1"/><text x="64" y="394.0" font-size="10" fill="#94a3b8" text-anchor="end">40%</text><line x1="70" y1="310.0" x2="1050" y2="310.0" stroke="#334155" stroke-width="1"/><text x="64" y="314.0" font-size="10" fill="#94a3b8" text-anchor="end">60%</text><line x1="70" y1="230.0" x2="1050" y2="230.0" stroke="#334155" stroke-width="1"/><text x="64" y="234.0" font-size="10" fill="#94a3b8" text-anchor="end">80%</text><line x1="70" y1="150.0" x2="1050" y2="150.0" stroke="#334155" stroke-width="1"/><text x="64" y="154.0" font-size="10" fill="#94a3b8" text-anchor="end">100%</text><text x="110.0" y="408" font-size="11" fill="#cbd5e1" text-anchor="middle">4</text><text x="288.0" y="408" font-size="11" fill="#cbd5e1" text-anchor="middle">8</text><text x="466.0" y="408" font-size="11" fill="#cbd5e1" text-anchor="middle">16</text><text x="644.0" y="408" font-size="11" fill="#cbd5e1" text-anchor="middle">32</text><text x="822.0" y="408" font-size="11" fill="#cbd5e1" text-anchor="middle">64</text><text x="1000.0" y="408" font-size="11" fill="#cbd5e1" text-anchor="middle">128</text><text x="560.0" y="428" font-size="11" fill="#94a3b8" text-anchor="middle">connection pool (min = max)</text><text x="70" y="142" font-size="10" fill="#94a3b8">throughput, % of each workload’s own peak</text><line x1="644.0" y1="150" x2="644.0" y2="390" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/><path d="M110.0,269.8 L288.0,155.6 L466.0,152.4 L644.0,150.0" fill="none" stroke="#d55181" stroke-width="2.5"/><circle cx="110.0" cy="269.8" r="5" fill="#d55181" stroke="#0f172a" stroke-width="2"/><text x="110.0" y="286.8" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">70%</text><circle cx="288.0" cy="155.6" r="5" fill="#d55181" stroke="#0f172a" stroke-width="2"/><text x="288.0" y="172.6" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">99%</text><circle cx="466.0" cy="152.4" r="5" fill="#d55181" stroke="#0f172a" stroke-width="2"/><circle cx="644.0" cy="150.0" r="5" fill="#d55181" stroke="#0f172a" stroke-width="2"/><path d="M110.0,350.9 L288.0,237.6 L466.0,165.5 L644.0,150.0 L822.0,154.7 L1000.0,179.8" fill="none" stroke="#3987e5" stroke-width="2.5"/><circle cx="110.0" cy="350.9" r="5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="110.0" y="339.9" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">50%</text><circle cx="288.0" cy="237.6" r="5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="288.0" y="226.6" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">78%</text><circle cx="466.0" cy="165.5" r="5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><circle cx="644.0" cy="150.0" r="5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="644.0" y="139.0" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">100%</text><circle cx="822.0" cy="154.7" r="5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><circle cx="1000.0" cy="179.8" r="5" fill="#3987e5" stroke="#0f172a" stroke-width="2"/><text x="1000.0" y="168.8" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">93%</text><text x="911.0" y="190.0" font-size="10" fill="#3987e5" text-anchor="middle">−7% past the peak</text><text x="644.0" y="144.0" font-size="9" fill="#94a3b8" text-anchor="middle">optimum pool 32</text><text x="24" y="438" font-size="10" fill="#94a3b8">Runtime-bound (single-read): the runtime’s cores are the ceiling — connections past pool 8 neither help nor hurt (flat). DB-bound (aggregate): connections past the DB’s</text>
<text x="24" y="452" font-size="10" fill="#94a3b8">optimal concurrency (~32, higher because the 3-query aggregate holds each connection longer — Little’s law) actively hurt. Single-read measured to pool 32; aggregate to 128.</text>
</svg>
