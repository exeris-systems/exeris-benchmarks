<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="474" viewBox="0 0 1200 474" font-family="Verdana,Helvetica,sans-serif" role="img" aria-label="Open-loop wrk2 CO-free p99 latency curves, light and heavy">
<rect width="1200" height="474" fill="#0f172a"/>
<text x="24" y="30" font-size="17" font-weight="bold" fill="#f8fafc">Open-loop wrk2 — CO-free service-time p99 vs offered rate (pinned, lean-co-resident pairs)</text>
<text x="24" y="50" font-size="11" fill="#94a3b8">campaign 20260723-155158 · driver.mode=open, percentiles publishable=true only · mean AB+BA · pair-3 (two heavy JVMs) excluded — co-residence · comparison-eligible</text>
<rect x="24" y="64" width="14" height="14" rx="3" fill="#3987e5"/><text x="44" y="76" font-size="12" fill="#cbd5e1">exeris-community</text>
