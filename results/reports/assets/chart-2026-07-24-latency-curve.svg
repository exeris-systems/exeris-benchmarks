<text x="1174" y="103" font-size="9" fill="#3987e5" text-anchor="end">13.2</text>
<text x="1174" y="150" font-size="9" fill="#e08e0b" text-anchor="end">10.9</text>
<text x="1174" y="312" font-size="9" fill="#22a06b" text-anchor="end">3.8</text>
<line x1="1180" y1="112" x2="1120" y2="128" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
<text x="1116" y="126" font-size="9" fill="#94a3b8" text-anchor="end">co-residence, not heap</text>
<text x="1116" y="139" font-size="9" fill="#94a3b8" text-anchor="end">(isolated: ~2.9 ms, heap-indep.)</text>
<text x="24" y="440" font-size="10" fill="#94a3b8">LIGHT: Exeris holds ~1.5–2.2 ms p99 flat across a 5× rate range; Quarkus-tuned rises to 5.2 and Hibernate to 7.3 — ordering exeris &lt; tuned &lt; hibernate at every rung (the first CO-free eligible latency result favoring Exeris).</text>
<text x="24" y="456" font-size="10" fill="#94a3b8">HEAVY: below the ~11k DB ceiling all three sit at ~2.4–5 ms (tuned marginally tightest). At 10k the tuned tail stays 3.8 ms while Exeris/Hibernate climb — but Exeris's climb is co-residence (isolated open-loop @10k = ~2.9 ms, heap-independent), not a runtime tail.</text>
