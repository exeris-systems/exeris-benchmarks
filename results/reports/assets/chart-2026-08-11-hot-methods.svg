<text x="40" y="506" font-size="11" fill="#f8fafc">Highlighted rows are org.springframework.aop / .core frames — Spring Data's projection-proxy machinery, above Hibernate's own tuple materialisation.</text><text x="40" y="528" font-size="10" fill="#94a3b8">This is NOT a flamegraph on purpose. Frame width in a flame reads as a complete cost decomposition, and the pair moves TWO things at once — Hibernate and Spring Data projections — whose split is unmeasured (L10, §8). A ranked list shows the same evidence without implying the split.</text><text x="40" y="546" font-size="10" fill="#94a3b8">Source: committed jfr-views/*.hot-methods.txt. Raw .jfr is on the perf box, not in this repo (size); it is available on request and a flamegraph can be generated from it.</text></svg>
