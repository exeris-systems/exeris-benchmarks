# Infrastructure stack for e2e-shop-order-saga benchmark
# Services: postgres:16.2 (with seed.sql), neo4j:5.16-community, axonserver:2024.2.22,
#           restate:1.7.2 (started only for the restate target, like axonserver for spring/quarkus)
# graph_track: neo4j | tier: community | transport: loopback-h2c
# Usage: docker compose -f runtime/compose/e2e-shop-order-saga.yml up -d
# Seed is loaded automatically via initdb on first start.
# Stop: docker compose -f runtime/compose/e2e-shop-order-saga.yml down -v
#
# PRE-FLIGHT HARNESS NOTE — Spring Boot target (Axon Server mode):
#   axon.axonserver.enabled=true — Spring connects to Axon Server at localhost:8124.
#   Production simulation: commands routed via CommandGateway → Axon Server → OrderAggregate.
#   benchmark-axonserver container MUST be healthy before starting Spring target.
#   Axon Server CPU/RSS is NOT captured by per-process resource sampler — it runs in Docker.
#   Use docker stats exeris-e2e-saga-axonserver for Axon Server resource attribution.
#   All resource comparisons vs Exeris Community MUST note: Exeris saga overhead is fully
#   inside the Exeris JVM process; Axon Server overhead is in a separate container (not counted).
#
#   REQUIRED METADATA to capture at benchmark start:
#     - axon.axonserver.enabled from running Spring app (expected: true)
#     - Axon Server health at localhost:8024 (expected: healthy)
#     - Spring app JAR build commit SHA
#     - Hardware profile + JDK version
#     - k6 script version / commit SHA

services:
  benchmark-postgres:
    image: postgres:16.2
    container_name: exeris-e2e-saga-postgres
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ../db/seed/v1_core.sql:/docker-entrypoint-initdb.d/01-v1-core.sql:ro
      - ../db/seed/v2_shop.sql:/docker-entrypoint-initdb.d/02-v2-shop.sql:ro
      - ../db/seed/v3_outbox_axon.sql:/docker-entrypoint-initdb.d/03-v3-outbox-axon.sql:ro
      - ../db/seed/v5_flow_saga_state.sql:/docker-entrypoint-initdb.d/05-v5-flow-saga-state.sql:ro
      - e2e-saga-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  benchmark-db-seed:
    image: postgres:16.2
    container_name: exeris-e2e-saga-db-seed
    depends_on:
      benchmark-postgres:
        condition: service_healthy
    environment:
      PGHOST: benchmark-postgres
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ../db/seed/v0_clean.sql:/seed/v0_clean.sql:ro
      - ../db/seed/v1_core.sql:/seed/v1_core.sql:ro
      - ../db/seed/v2_shop.sql:/seed/v2_shop.sql:ro
      - ../db/seed/v3_outbox_axon.sql:/seed/v3_outbox_axon.sql:ro
      - ../db/seed/v5_flow_saga_state.sql:/seed/v5_flow_saga_state.sql:ro
    command: >
      bash -c "
        echo '[seed] Cleaning existing data (v0_clean)...' &&
        psql -f /seed/v0_clean.sql &&
        echo '[seed] Applying v1_core...' &&
        psql -f /seed/v1_core.sql &&
        echo '[seed] Applying v2_shop...' &&
        psql -f /seed/v2_shop.sql &&
        echo '[seed] Applying v3_outbox_axon...' &&
        psql -f /seed/v3_outbox_axon.sql &&
        echo '[seed] Applying v5_flow_saga_state...' &&
        psql -f /seed/v5_flow_saga_state.sql &&
        echo '[seed] All migrations applied.'
      "
    restart: "no"

  # Behind a profile since 2026-07-31: the graph was removed from the saga scenario
  # (CONTRACT-v2 §2), so Neo4j is NOT part of the §1 deployment unit for saga runs.
  # A plain `docker compose up -d` must not start it — it idles at ~2.1 GB RSS next
  # to the measurement, which is exactly the kind of unaccounted process the §1
  # deployment-unit definition exists to prevent.
  #
  # Start it explicitly for the separate graph benchmark:
  #   docker compose --profile graph up -d benchmark-neo4j
  benchmark-neo4j:
    profiles: ["graph"]
    image: neo4j:5.16-community
    container_name: exeris-e2e-saga-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: "[]"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_memory_transaction_total_max: 1500m
      NEO4J_server_bolt_thread__pool__min__size: 20
      NEO4J_server_bolt_thread__pool__max__size: 200
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - e2e-saga-neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  benchmark-axonserver:
    image: axoniq/axonserver:2024.2.22
    container_name: exeris-e2e-saga-axonserver
    environment:
      AXONIQ_AXONSERVER_NAME: exeris-bench-axonserver
      AXONIQ_AXONSERVER_HOSTNAME: localhost
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Daxoniq.axonserver.devmode.enabled=true"
    ports:
      - "127.0.0.1:8024:8024"
      - "127.0.0.1:8124:8124"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8024/actuator/health"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 20s

  # Started ONLY for the restate target (run-e2e-shop-order-saga-baseline.sh
  # detects *restate* in target_app/contract_id, mirroring the axonserver
  # gating for spring/quarkus). Deployment-unit note: restate-server CPU/RSS is
  # NOT captured by the per-process resource sampler — the baseline records
  # docker stats for exeris-e2e-saga-restate-server separately, same policy as
  # Axon Server above. Durability: restate-server 1.7 defaults to the
  # replicated loglet with RocksDB WAL fsync per commit batch (CONTRACT-v2 s8
  # tier T2, fsync node-durable — comparable with Postgres synchronous_commit=on).
  # Do NOT set RESTATE_LOG_SERVER__ROCKSDB_DISABLE_WAL_FSYNC=true here without
  # relabeling the run's durability tier.
  # No container healthcheck: the image ships no shell/wget; the baseline polls
  # the admin API (http://localhost:9070/health) from the host instead.
  # host.docker.internal is required so the server can invoke the SDK endpoint
  # (:9084) running in the target JVM on the host.
  benchmark-restate-server:
    image: docker.restate.dev/restatedev/restate:1.7.2
    container_name: exeris-e2e-saga-restate-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"   # HTTP ingress
      - "127.0.0.1:9070:9070"   # Admin API + web UI
      - "127.0.0.1:9071:9071"
    volumes:
      # Anonymous volume ON PURPOSE: the baseline force-recreates this service
      # with `rm -sf --volumes` per run so stale invocation journals from a
      # previous run can never replay into the next one.
      - /restate-data

  # CONTRACT-v2 §4 (parking workload): external payment gateway.
  #
  # S_pay does not answer inline — the target dispatches here, gets 202, and the
  # saga PARKS. This service answers asynchronously after PAYMENT_STUB_DELAY_MS,
  # which is the parameter that sets parked concurrency (parked ≈ arrival rate ×
  # delay): 100 ms for perf runs, 1000 ms for crash runs.
  #
  # Part of the §1 deployment unit and sampled by the whole-deployment footprint,
  # same policy as Axon Server and restate-server.
  #
  # host.docker.internal mirrors the restate-server wiring above: the callback
  # goes back to the target JVM running on the HOST, so "localhost" inside this
  # container would be wrong.
  #
  # No image build: the stub is stdlib-only Python mounted read-only, so there is
  # nothing to keep in sync between a Dockerfile and the source.
  benchmark-payment-gateway:
    image: python:3.12-alpine
    container_name: exeris-e2e-saga-payment-gateway
    command: ["python", "-u", "/app/payment_stub.py"]
    environment:
      PAYMENT_STUB_PORT: "9300"
      PAYMENT_STUB_DELAY_MS: "${PAYMENT_STUB_DELAY_MS:-100}"
      PAYMENT_STUB_DELAY_JITTER_MS: "${PAYMENT_STUB_DELAY_JITTER_MS:-0}"
      # The §4.1 decline rule lives in the stub now, so this — not the targets'
      # EXERIS_SAGA_FAULT_MODE — is what actually switches business faults off
      # for any parking shape. Defaults to terminal, matching every target's
      # default. The §7 oracle's expected compensation count must agree with it.
      PAYMENT_STUB_FAULT_MODE: "${PAYMENT_STUB_FAULT_MODE:-terminal}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../targets/payment-gateway-stub/payment_stub.py:/app/payment_stub.py:ro
    ports:
      - "127.0.0.1:9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9300/health',timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  e2e-saga-pgdata:
    driver: local
  e2e-saga-neo4jdata:
    driver: local
