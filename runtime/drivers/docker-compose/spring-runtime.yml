version: "3.9"

# Docker Compose for Exeris Spring Runtime benchmark target.
# Used by runtime/drivers/start-target.sh spring-runtime
#
# Build image from exeris-spring-runtime repo:
#   cd path/to/exeris-spring-runtime && docker build -t exeris-spring-runtime:latest .

services:
  exeris-spring-runtime:
    image: "${EXERIS_SPRING_RUNTIME_IMAGE:-exeris-spring-runtime:latest}"
    build:
      context: ../../..
      dockerfile: targets/exeris-spring-runtime/Dockerfile
    container_name: exeris-bench-spring-runtime
    network_mode: host
    environment:
      EXERIS_PORT: "9001"
      EXERIS_DB_JDBC_URL: "jdbc:postgresql://localhost:5432/benchmark_db"
      EXERIS_DB_USERNAME: "benchmark"
      EXERIS_DB_PASSWORD: "benchmark"
      EXERIS_MODE: "${EXERIS_SPRING_MODE:-pure}"   # pure | compat
      EXERIS_LOG_LEVEL: WARN
      EXERIS_METRICS: "false"
      # Spring-specific
      SPRING_MAIN_BANNER-MODE: "off"
      LOGGING_LEVEL_ROOT: "WARN"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
