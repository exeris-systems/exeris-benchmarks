# Pilot cell P0132-lifo: P0132 with a run-next slot for a self-wakeup.
# Cumulative: each cell holds the previous cell's properties and adds its own.
# Arm Dv; not evidence. Values are those LocalityFlags accepts.
exeris.locality.carrierResolve=mounted
exeris.locality.poller.route=preferred
exeris.locality.factory.preferredCarrier=true
exeris.locality.idle.spinNs=20000
exeris.locality.wakeup=readfirst
exeris.locality.queue=deque
exeris.locality.selfWakeup=true
exeris.locality.yield.checkEvery=16
exeris.locality.steal=true
exeris.locality.steal.batch=half
exeris.locality.place=p2c
exeris.locality.lifoSlot=true
