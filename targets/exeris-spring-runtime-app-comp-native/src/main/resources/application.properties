# Spring-on-Exeris — COMPATIBILITY MODE, NATIVE PERSISTENCE.
#
# The second diagonal of the two-axis space. Everything in this file is copied verbatim from
# targets/exeris-spring-runtime-app-pure-native EXCEPT the one line that flips the web axis:
#
#     exeris.runtime.web.mode=compatibility
#
# That single line is the entire difference between this target and app-pure-native. Keep it that
# way: the pair app-pure-native <-> app-comp-native is the only place in this repo where the
# Pure-vs-Compat web axis is isolated with everything else — Boot line, kernel line, Jackson line,
# pool config, bean graph, dependency set — held identical by construction. Add a property here
# that is not in app-pure-native and the axis silently acquires a second variable.
#
# WHY THE PAIR WITH app-comp IS *NOT* THE CLEAN ONE. targets/exeris-spring-runtime-app-comp is
# still on Spring Boot 3.5.14 and Jackson 2 (com.fasterxml) — it was outside the 2026-08-06
# alignment, which covered only the four ladder arms. Comparing it to this target would mix the
# persistence axis with a Boot major, a Jackson major in the response path of every request,
# Spring Security presence, and the flow stack. That pair passes the strict gate (both are
# mode=compat) and is nonetheless the more confounded of the two. Gate eligibility is not
# fairness; see docs/benchmark-philosophy.md.
spring.main.web-application-type=none
exeris.runtime.network.port=${EXERIS_PORT:8080}
spring.threads.virtual.enabled=true

# ----------------------------------------------------------------------
# THE AXIS LINE — and the only line not present in app-pure-native.
# ----------------------------------------------------------------------
# Turns on ExerisCompatAutoConfiguration, which is gated on
#   @ConditionalOnClass(ExerisCompatDispatcher) + @ConditionalOnProperty(exeris.runtime.web.mode)
# Both are satisfied without a new dependency: the compat classes ship inside
# exeris-spring-runtime-web, which this target already carries. Requests reach
# @RestController methods through ExerisCompatDispatcher / ExerisSpringMvcBridge instead of
# ExerisWebAutoConfiguration's native ExerisHttpDispatcher.
#
# No jakarta.servlet-api and no spring-boot-starter-security here. The compat arm needs the
# servlet API only because Spring Security's WebSecurityConfiguration reflects on
# jakarta.servlet.Filter at autoconfig time; with no Spring Security on this classpath, compat
# dispatch needs neither. ExerisCompatAutoConfiguration's SecurityFilterConfiguration is
# class-conditional and simply stays off.
exeris.runtime.web.mode=compatibility

# Required, and for the same reason as in app-pure-native: ExerisTransactionAutoConfiguration is
# gated on @ConditionalOnProperty(prefix="exeris.runtime.tx", name="enabled", havingValue="true")
# with no matchIfMissing, and this arm needs the PersistenceEngineProvider it contributes.
#
# NOTE ON WHAT THIS ARM IS TESTING. TransactionalExecutor resolves
# KernelProviders.PERSISTENCE_ENGINE, a ScopedValue bound per request by the kernel provider
# binder. Its coverage is not universal in compat mode — the compat security filter ran outside
# it until runtime PR #48, and flow-worker virtual threads still do. If the compat dispatch path
# does not bind it, this target fails at the first request with the named IllegalStateException
# from ExerisPersistenceConfiguration, and THAT is the finding: the two axes are coupled and the
# best combination is unreachable. A boot without a request does not settle it.
exeris.runtime.tx.enabled=true

# exeris.runtime.data.compat-datasource.enabled is deliberately ABSENT — same as app-pure-native.
# There is no JPA, no Hibernate, no Spring DataSource and no JdbcTemplate on this target;
# repositories talk to the kernel persistence engine through TransactionalExecutor. That absence
# is the persistence axis, and it is what separates this target from app-comp.

exeris.runtime.persistence.jdbc-url=${EXERIS_DB_JDBC_URL}
exeris.runtime.persistence.username=${EXERIS_DB_USERNAME}
exeris.runtime.persistence.password=${EXERIS_DB_PASSWORD}
exeris.runtime.persistence.max-pool-size=${EXERIS_DB_POOL_MAX_SIZE:${EXERIS_DB_POOL_MAX:16}}
exeris.runtime.persistence.min-pool-size=${EXERIS_DB_POOL_MIN_SIZE:${EXERIS_DB_POOL_MIN:0}}
exeris.runtime.persistence.pool-warmup-enabled=${EXERIS_DB_POOL_WARMUP_ENABLED:true}
exeris.runtime.persistence.pool-warmup-connections=${EXERIS_DB_POOL_WARMUP_CONNECTIONS:8}
exeris.runtime.persistence.connection-timeout-ms=${EXERIS_DB_CONNECTION_TIMEOUT_MS:30000}
