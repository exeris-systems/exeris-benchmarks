# ----------------------------------------------------------------------
# Web application type — DISABLE Spring Boot's servlet-container start
# ----------------------------------------------------------------------
# jakarta.servlet-api is on the classpath because Spring Security's
# WebSecurityConfiguration reflects on jakarta.servlet.Filter at autoconfig
# time. That presence triggers Spring Boot's WebApplicationType.SERVLET
# detection, which makes Spring Boot search for a ServletWebServerFactory
# (Tomcat / Jetty / Undertow) — all banned by the enforcer rule below and
# by the host-runtime Pure-Mode classpath guards. Without a factory, Spring
# Boot fails with "Unable to start web server".
#
# In Exeris Compat Mode, ingress is owned by the kernel HTTP server, NOT
# by DispatcherServlet. `web-application-type=none` tells Spring Boot:
# build a GenericApplicationContext, do not search for a servlet container.
# @RestController routing still works via ExerisCompatDispatcher (overlay
# on kernel ingress per ADR-011).
spring.main.web-application-type=none

# ----------------------------------------------------------------------
# Kernel HTTP port — canonical key per ExerisSpringConfigProvider.
# ----------------------------------------------------------------------
# The legacy `server.port` is ignored under web-application-type=none.
# Real port is owned by the kernel via exeris.runtime.network.port.
exeris.runtime.network.port=${EXERIS_PORT:8080}

spring.threads.virtual.enabled=true

# ----------------------------------------------------------------------
# Exeris runtime: compatibility-mode web + flow-based saga
# ----------------------------------------------------------------------
# - web.mode=compatibility  → ExerisCompatAutoConfiguration overlays the
#                              Spring MVC dispatch path on the Exeris ingress
#                              (ADR-011). @RestController + Authentication
#                              injection keep working.
# - flow.enabled=true       → ExerisFlowAutoConfiguration wires the flow
#                              engine and discovers ExerisFlowDefinition
#                              beans (ShopOrderFlowDefinition).
# - flow.persistence-enabled=true → durable JdbcFlowSnapshotStore (ADR-022)
#                              when a JDBC PersistenceEngine is bound;
#                              graceful in-memory fallback otherwise.
#                              Explicit even though it matches the default.
# - data.compat-datasource.enabled=true → ExerisDataSource adapter wins
#                              over Spring Boot's auto-DataSource. JPA still
#                              binds Connections, but acquisition flows
#                              through the Exeris seam emitting
#                              JpaConnectionAcquired / JpaConnectionBound
#                              JFR events (ADR-017 §6.4 — see README).
exeris.runtime.web.mode=compatibility
exeris.runtime.flow.enabled=true
exeris.runtime.flow.persistence-enabled=true
exeris.runtime.data.compat-datasource.enabled=true

# ----------------------------------------------------------------------
# Persistence — both surfaces populated
# ----------------------------------------------------------------------
# Spring side (used by JPA/Hibernate via DataSourceProperties):
spring.datasource.url=${EXERIS_DB_JDBC_URL}
spring.datasource.username=${EXERIS_DB_USERNAME}
spring.datasource.password=${EXERIS_DB_PASSWORD}
# Kernel side (read by ExerisSpringConfigProvider → PersistenceSettings):
exeris.runtime.persistence.jdbc-url=${EXERIS_DB_JDBC_URL}
exeris.runtime.persistence.username=${EXERIS_DB_USERNAME}
exeris.runtime.persistence.password=${EXERIS_DB_PASSWORD}
exeris.runtime.persistence.max-pool-size=${EXERIS_DB_POOL_MAX_SIZE:${EXERIS_DB_POOL_MAX:16}}
# min-pool-size warms the kernel-owned HikariCP pool at boot so the compat
# target starts with the same hot pool as the spring/quarkus targets (which set
# hikari minimum-idle / agroal min-size). Without it the shared pool boots cold
# (~1 connection) and the first burst of load times out on connection
# acquisition during the ramp. The launcher exports EXERIS_DB_POOL_MIN_SIZE=16;
# default 0 keeps Hikari's lazy default when the env var is unset.
exeris.runtime.persistence.min-pool-size=${EXERIS_DB_POOL_MIN_SIZE:${EXERIS_DB_POOL_MIN:0}}
# Pool warmup forces HikariCP to create N connections in parallel before the
# kernel reports persistence "started" (i.e. before the HTTP port opens, given
# the SERVICES-before-RUNTIME phase ordering) — fail-fast on a bad DB at boot
# instead of a per-request storm. Default depth is 2 (a reachability probe);
# bump to the clamp ceiling (8) so the t=0 h2load/wrk connection burst hits a
# partly-hot pool instead of a 1-connection cold one. This blunts the cold-start
# spike; the sustained case is handled by connection-timeout below.
exeris.runtime.persistence.pool-warmup-enabled=${EXERIS_DB_POOL_WARMUP_ENABLED:true}
exeris.runtime.persistence.pool-warmup-connections=${EXERIS_DB_POOL_WARMUP_CONNECTIONS:8}
# Blocking acquire timeout. Levels the field with Spring Hikari (~30 s default)
# and Quarkus Agroal: under cold-start / latency-spike contention the caller
# WAITS for a connection (contention surfaces as latency) instead of fail-fast
# throwing connectionExhausted → HTTP 500. Bound by ExerisSpringConfigProvider
# via the persistence alias (runtime commit 8722631); the launcher exports
# EXERIS_DB_CONNECTION_TIMEOUT_MS=30000. Default 30000 ms when the env is unset.
exeris.runtime.persistence.connection-timeout-ms=${EXERIS_DB_CONNECTION_TIMEOUT_MS:30000}

# Hibernate behaviour kept as-is from the pre-migration shape so the bench
# workload exercises the same JPA/Hibernate path.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.column_ordering_strategy=legacy

# ----------------------------------------------------------------------
# CRITICAL — bootstrap-order workaround for the Compat-Datasource path
# ----------------------------------------------------------------------
# Hibernate normally calls DataSource.getConnection() at EntityManagerFactory
# construction time (inside JdbcEnvironmentInitiator) to probe the dialect
# from JDBC metadata. EMF construction happens during Spring refresh() —
# BEFORE ExerisRuntimeLifecycle.start() runs the kernel bootstrap that
# binds PersistenceEngine to the ScopedValue. So the probe fails with
# "Exeris PersistenceEngine is not bound in the current scope."
#
# This is the same architectural gap budgetHQ's transaction-service POM
# documents as a "Level 2 deferral" (UNTESTED ASSUMPTION T_be_2.2.1) —
# nobody has made this combination work upstream yet. Workaround:
#   1. Tell Hibernate the dialect explicitly so it doesn't need metadata.
#   2. Forbid Hibernate from accessing JDBC metadata at boot.
# Result: EMF construction completes without calling getConnection().
# Lazy connection acquisition happens on first real query, on a request
# thread, where the kernel-owned ScopedValue is bound.
#
# Trade-off: any Hibernate code path that genuinely needs JDBC metadata
# at startup (schema validation with ddl-auto=validate, second-level
# cache region setup against vendor-specific features) would fail.
# We have ddl-auto=none and no L2 cache, so this is safe.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# ----------------------------------------------------------------------
# Graph backend selector — unchanged across the swap.
# ----------------------------------------------------------------------
exeris.graph.backend.type=${EXERIS_GRAPH_BACKEND_TYPE:pgq}
exeris.graph.neo4j.uri=${EXERIS_GRAPH_NEO4J_URI:}
exeris.graph.neo4j.user=${EXERIS_GRAPH_NEO4J_USER:}
exeris.graph.neo4j.password=${EXERIS_GRAPH_NEO4J_PASSWORD:}
exeris.graph.neo4j.database=${EXERIS_GRAPH_NEO4J_DATABASE:neo4j}
exeris.graph.neo4j.pool.max-size=${EXERIS_GRAPH_NEO4J_POOL_MAX_SIZE:100}

# ----------------------------------------------------------------------
# Saga engine status label surfaced via GET /graph/ping. Reflects the
# migration: the workload now runs on exeris-spring-runtime-flow.
# ----------------------------------------------------------------------
exeris.saga.engine.mode=${EXERIS_SAGA_ENGINE_MODE:exeris-flow}
