# Spring-on-Exeris — PURE MODE, NATIVE PERSISTENCE.
#
# Two lines are absent here, and their absence is the whole point of this target:
#
#   1. exeris.runtime.web.mode=compatibility — without it ExerisCompatAutoConfiguration stays
#      off, so there is no ExerisCompatDispatcher / ExerisSpringMvcBridge / handler-method
#      registry and no Spring MVC argument resolvers. Requests are served by
#      ExerisWebAutoConfiguration's native ExerisHttpDispatcher against @ExerisRoute beans.
#      This is shared with targets/exeris-spring-runtime-app-pure.
#
#   2. exeris.runtime.data.compat-datasource.enabled=true — this target does NOT go through
#      ExerisDataSource. There is no JPA, no Hibernate, no Spring DataSource and no
#      JdbcTemplate; repositories talk to the kernel persistence engine directly through
#      eu.exeris.kernel.spi.persistence.TransactionalExecutor. This is what separates it from
#      exeris-spring-runtime-app-pure, which is pure on the web axis only.
#
# Consequently every spring.datasource.* and spring.jpa.* property is gone. What remains is
# the kernel's own persistence configuration, which is byte-identical to the other two Exeris
# arms so the pool is not a variable on the persistence axis: same max-pool-size, same warmup,
# same connection timeout, same JDBC URL (including the pgjdbc fetch-config normalisation
# carried by EXERIS_DB_JDBC_URL).
spring.main.web-application-type=none
exeris.runtime.network.port=${EXERIS_PORT:8080}
spring.threads.virtual.enabled=true

# Required, and only by THIS arm. ExerisTransactionAutoConfiguration is gated on
#   @ConditionalOnProperty(prefix="exeris.runtime.tx", name="enabled", havingValue="true")
# with no matchIfMissing, so it never fires by default — which the other three arms never
# notice, because they reach the database through the compat DataSource and do not need
# anything the module contributes. This arm does: PersistenceEngineProvider is the supported
# Spring-side accessor for the kernel PersistenceEngine, and ExerisPersistenceConfiguration
# builds its TransactionalExecutor on top of it. Without this line the context fails with
# "Parameter 0 of method exerisTransactionalExecutor ... required a bean of type
# PersistenceEngineProvider" (first boot against a DB, 2026-08-06).
#
# The module's ExerisPlatformTransactionManager also becomes available as a side effect. It is
# deliberately unused — UserService carries no @Transactional and the read boundary lives inside
# the repository — so it sits inert and adds nothing to the measured path.
exeris.runtime.tx.enabled=true

exeris.runtime.persistence.jdbc-url=${EXERIS_DB_JDBC_URL}
exeris.runtime.persistence.username=${EXERIS_DB_USERNAME}
exeris.runtime.persistence.password=${EXERIS_DB_PASSWORD}
exeris.runtime.persistence.max-pool-size=${EXERIS_DB_POOL_MAX_SIZE:${EXERIS_DB_POOL_MAX:16}}
exeris.runtime.persistence.min-pool-size=${EXERIS_DB_POOL_MIN_SIZE:${EXERIS_DB_POOL_MIN:0}}
exeris.runtime.persistence.pool-warmup-enabled=${EXERIS_DB_POOL_WARMUP_ENABLED:true}
exeris.runtime.persistence.pool-warmup-connections=${EXERIS_DB_POOL_WARMUP_CONNECTIONS:8}
exeris.runtime.persistence.connection-timeout-ms=${EXERIS_DB_CONNECTION_TIMEOUT_MS:30000}
