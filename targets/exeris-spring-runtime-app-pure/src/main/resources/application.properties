# Spring-on-Exeris — PURE MODE.
#
# The defining line of this file is the one that is NOT here: there is no
# exeris.runtime.web.mode=compatibility. Without it ExerisCompatAutoConfiguration stays off,
# so there is no ExerisCompatDispatcher / ExerisSpringMvcBridge / ExerisHandlerMethodRegistry
# and no Spring MVC argument resolvers. Requests are served by ExerisWebAutoConfiguration's
# native ExerisHttpDispatcher against @ExerisRoute-annotated ExerisRequestHandler beans.
#
# Everything below this point is copied verbatim from
# targets/exeris-spring-runtime-app-comp/src/main/resources/application.properties so that
# persistence, threading and JPA are NOT variables on the Pure-vs-Compat axis. Change one,
# change both.
spring.main.web-application-type=none
exeris.runtime.network.port=${EXERIS_PORT:8080}
spring.threads.virtual.enabled=true

exeris.runtime.data.compat-datasource.enabled=true
spring.datasource.url=${EXERIS_DB_JDBC_URL}
spring.datasource.username=${EXERIS_DB_USERNAME}
spring.datasource.password=${EXERIS_DB_PASSWORD}
exeris.runtime.persistence.jdbc-url=${EXERIS_DB_JDBC_URL}
exeris.runtime.persistence.username=${EXERIS_DB_USERNAME}
exeris.runtime.persistence.password=${EXERIS_DB_PASSWORD}
exeris.runtime.persistence.max-pool-size=${EXERIS_DB_POOL_MAX_SIZE:${EXERIS_DB_POOL_MAX:16}}
exeris.runtime.persistence.min-pool-size=${EXERIS_DB_POOL_MIN_SIZE:${EXERIS_DB_POOL_MIN:0}}
exeris.runtime.persistence.pool-warmup-enabled=${EXERIS_DB_POOL_WARMUP_ENABLED:true}
exeris.runtime.persistence.pool-warmup-connections=${EXERIS_DB_POOL_WARMUP_CONNECTIONS:8}
exeris.runtime.persistence.connection-timeout-ms=${EXERIS_DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.column_ordering_strategy=legacy
# Explicit dialect + no metadata probe: Hibernate must not call DataSource.getConnection()
# during EntityManagerFactory init, which happens before ExerisRuntimeLifecycle.start().
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
