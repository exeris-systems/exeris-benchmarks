quarkus.http.port=${EXERIS_HTTP_PORT:9002}
quarkus.http.ssl-port=${EXERIS_PORT:9443}
quarkus.http.insecure-requests=${EXERIS_INSECURE_REQUESTS:enabled}
quarkus.http.ssl.certificate.files=${EXERIS_TRANSPORT_CERT_PATH:}
quarkus.http.ssl.certificate.key-files=${EXERIS_TRANSPORT_KEY_PATH:}
quarkus.http.http2=${EXERIS_HTTP2_ENABLED:false}
# TLS 1.3 cipher suites: left to the JDK's default preference for a standalone
# run, so this target keeps its own TLS baseline. For CROSS-STACK FAIRNESS the
# comparative harness exports EXERIS_TLS_CIPHER_SUITES=TLS_AES_128_GCM_SHA256
# (Exeris negotiates AES-128 in native OpenSSL; the default JDK server preference
# is AES-256-GCM-SHA384, which would inflate Quarkus crypto CPU and skew the
# comparison). Pin applied at the runner, not baked into every TLS run here.
quarkus.http.ssl.cipher-suites=${EXERIS_TLS_CIPHER_SUITES:}
quarkus.log.level=${EXERIS_LOG_LEVEL:WARN}
quarkus.log.console.level=${EXERIS_LOG_LEVEL:WARN}
quarkus.live-reload.enabled=false
quarkus.package.jar.type=uber-jar
# Virtual-thread execution is enabled via @RunOnVirtualThread annotations on resources.
quarkus.vertx.event-loops-pool-size=1
# --- Netty transport axis ---
# JDK NIO (pure-Java java.nio selectors) by default; native epoll is opt-in.
# true requires the epoll lib on the classpath (build -Pnetty-native-epoll); if it
# is absent Netty silently falls back to NIO. Linux-native epoll only.
quarkus.vertx.prefer-native-transport=${EXERIS_NETTY_NATIVE_TRANSPORT:true}
# --- TLS engine axis ---
# JSSE (JDK SSLEngine, pure Java, large heap byte[] allocations) by default. true
# switches the HTTPS server to the native BoringSSL engine via NativeTlsEngineCustomizer
# and requires the tcnative-boringssl lib on the classpath (build -Pnetty-tcnative-boringssl).
# Read by the customizer: Quarkus exposes no built-in HTTP-server engine-selection knob
# (HttpServerOptionsUtils only ever installs JdkSSLEngineOptions).
exeris.transport.tls.native=${EXERIS_TLS_NATIVE:true}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${EXERIS_DB_JDBC_URL}
quarkus.datasource.username=${EXERIS_DB_USERNAME}
quarkus.datasource.password=${EXERIS_DB_PASSWORD}
quarkus.datasource.jdbc.min-size=${EXERIS_DB_POOL_MIN_SIZE:${EXERIS_DB_POOL_MIN:16}}
quarkus.datasource.jdbc.max-size=${EXERIS_DB_POOL_MAX_SIZE:${EXERIS_DB_POOL_MAX:256}}
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=true
# Pure-JDBC archetype: no Hibernate/ORM on any path. The entity-read-by-id path
# uses Agroal DataSource + PreparedStatement; the shop-order-saga path is already
# raw JDBC. Counterpart of quarkus-benchmark-app (Hibernate archetype); the only
# intended cross-target difference is the relational data-access layer.

exeris.graph.backend.type=${EXERIS_GRAPH_BACKEND_TYPE:pgq}
# Neo4j connection (uri/user/password) is intentionally NOT declared here.
# In non-neo4j tracks the env vars are unset, so the properties stay absent and
# resolve to the code-level @ConfigProperty defaults (GraphBackendProbeService: "",
# GraphShopService: Optional.empty) instead of forcing an empty-default expression
# (${VAR:}) that SmallRye fails to load eagerly. In a neo4j track the launcher sets
# EXERIS_GRAPH_NEO4J_URI/_USER/_PASSWORD, which Quarkus auto-maps to
# exeris.graph.neo4j.uri/user/password — so no indirection line is needed.
exeris.graph.neo4j.database=${EXERIS_GRAPH_NEO4J_DATABASE:neo4j}
exeris.graph.neo4j.pool.max-size=${EXERIS_GRAPH_NEO4J_POOL_MAX_SIZE:100}
# Axon Server connection gate — Quarkus-native counterpart of the Spring target's
# @ConditionalOnProperty(name="exeris.axon.enabled", havingValue="true"). false/unset
# (entity-read-by-id) makes AxonBusConfig produce an in-JVM SimpleCommandBus and open NO
# Axon Server gRPC connection (no reconnect loop); e2e-shop-order-saga sets
# EXERIS_AXON_ENABLED=true for the full Axon Server wiring. EXERIS_AXON_ENABLED auto-maps
# to this property, so the launcher only needs the env var.
exeris.axon.enabled=${EXERIS_AXON_ENABLED:false}
# LABEL CAVEAT (fairness axis, e2e-shop-order-saga): this target's Axon wiring is
# command-dispatch-only imperative orchestration — one CreateOrderCommand round-trip per
# order, saga steps and compensation invoked in-line, no event sourcing, no event-driven
# saga. The value below is the cross-stack scenario label expected by the scenario's env
# capture and comparative-pair-manifest, NOT a description of this target's internal
# wiring; comparative reports vs an event-sourced stack must label this axis explicitly.
exeris.axon.mode=${EXERIS_AXON_MODE:event-sourcing-outbox}
exeris.axonserver.host=${EXERIS_AXONSERVER_HOST:localhost}
exeris.axonserver.port=${EXERIS_AXONSERVER_PORT:8124}
