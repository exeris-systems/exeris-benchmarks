quarkus.http.port=${EXERIS_HTTP_PORT:9002}
quarkus.http.ssl-port=${EXERIS_PORT:9443}
quarkus.http.insecure-requests=${EXERIS_INSECURE_REQUESTS:enabled}
quarkus.http.ssl.certificate.files=${EXERIS_TRANSPORT_CERT_PATH:}
quarkus.http.ssl.certificate.key-files=${EXERIS_TRANSPORT_KEY_PATH:}
quarkus.http.http2=${EXERIS_HTTP2_ENABLED:false}
quarkus.log.level=${EXERIS_LOG_LEVEL:WARN}
quarkus.log.console.level=${EXERIS_LOG_LEVEL:WARN}
quarkus.live-reload.enabled=false
quarkus.package.jar.type=uber-jar
# Virtual-thread execution is enabled via @RunOnVirtualThread annotations on resources.

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${EXERIS_DB_JDBC_URL}
quarkus.datasource.username=${EXERIS_DB_USERNAME}
quarkus.datasource.password=${EXERIS_DB_PASSWORD}
quarkus.datasource.jdbc.min-size=${EXERIS_DB_POOL_MIN_SIZE:${EXERIS_DB_POOL_MIN:16}}
quarkus.datasource.jdbc.max-size=${EXERIS_DB_POOL_MAX_SIZE:${EXERIS_DB_POOL_MAX:256}}
quarkus.hibernate-orm.database.generation=none

exeris.graph.backend.type=${EXERIS_GRAPH_BACKEND_TYPE:pgq}
# Neo4j connection (uri/user/password) is intentionally NOT declared here.
# In non-neo4j tracks the env vars are unset, so the properties stay absent and
# resolve to the code-level @ConfigProperty defaults (GraphBackendProbeService: "",
# GraphShopService: Optional.empty) instead of forcing an empty-default expression
# (${VAR:}) that SmallRye fails to load eagerly. In a neo4j track the launcher sets
# EXERIS_GRAPH_NEO4J_URI/_USER/_PASSWORD, which Quarkus auto-maps to
# exeris.graph.neo4j.uri/user/password — so no indirection line is needed.
exeris.graph.neo4j.database=${EXERIS_GRAPH_NEO4J_DATABASE:neo4j}
exeris.graph.neo4j.pool.max-size=${EXERIS_GRAPH_NEO4J_POOL_MAX_SIZE:100}
exeris.axon.mode=${EXERIS_AXON_MODE:event-sourcing-outbox}
exeris.axonserver.host=${EXERIS_AXONSERVER_HOST:localhost}
exeris.axonserver.port=${EXERIS_AXONSERVER_PORT:8124}
