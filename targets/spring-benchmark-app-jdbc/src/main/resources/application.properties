server.port=${EXERIS_PORT:8080}
spring.threads.virtual.enabled=true
spring.datasource.url=${EXERIS_DB_JDBC_URL}
spring.datasource.username=${EXERIS_DB_USERNAME}
spring.datasource.password=${EXERIS_DB_PASSWORD}
spring.datasource.hikari.minimum-idle=${EXERIS_DB_POOL_MIN_SIZE:${EXERIS_DB_POOL_MIN:4}}
spring.datasource.hikari.maximum-pool-size=${EXERIS_DB_POOL_MAX_SIZE:${EXERIS_DB_POOL_MAX:16}}
# No spring.jpa.* here: Hibernate is off the classpath entirely (see pom.xml). The ORM arm's
# column_ordering_strategy=legacy exists to keep its generated SQL's column order stable; this
# arm writes its own SQL, so column order is fixed by the statement text and needs no setting.

exeris.graph.backend.type=${EXERIS_GRAPH_BACKEND_TYPE:pgq}
exeris.graph.neo4j.uri=${EXERIS_GRAPH_NEO4J_URI:}
exeris.graph.neo4j.user=${EXERIS_GRAPH_NEO4J_USER:}
exeris.graph.neo4j.password=${EXERIS_GRAPH_NEO4J_PASSWORD:}
exeris.graph.neo4j.database=${EXERIS_GRAPH_NEO4J_DATABASE:neo4j}
exeris.graph.neo4j.pool.max-size=${EXERIS_GRAPH_NEO4J_POOL_MAX_SIZE:100}
# Axon is gated on EXERIS_AXON_ENABLED (default false). e2e-shop-order-saga sets it
# true (unchanged behavior); pure-read scenarios leave it unset so Axon Server is not
# contacted (no gRPC retries) and the Axon module is not component-scanned
# (see AxonModuleConfiguration + SpringBenchmarkApplication exclude filter).
exeris.axon.enabled=${EXERIS_AXON_ENABLED:false}
axon.axonserver.enabled=${EXERIS_AXON_SERVER_ENABLED:${EXERIS_AXON_ENABLED:false}}
axon.axonserver.servers=${EXERIS_AXONSERVER_HOST:localhost}:${EXERIS_AXONSERVER_PORT:8124}
axon.eventhandling.processors.default.mode=subscribing

# CONTRACT-v2 §9(d) — tuning applied in THIS stack's favour, disclosed.
#
# Axon's default gives a @Saga's processor ONE segment and ONE thread
# (observed: "Worker assigned to segment Segment[0/0]"), so every saga's event
# progression is serialized through a single tracking thread. Measured effect at
# 50 sessions/s: saga latency 7613 ms median here versus 23 ms (exeris-community)
# and 34 ms (quarkus-hibernate), whose sagas run with full request-thread
# concurrency. Comparing a one-thread default against unbounded concurrency
# measures the default, not the framework — apples-to-oranges under this repo's
# fairness rule — so the processor is given real concurrency.
#
# Maintainer-approved 2026-07-30 in preference to reporting the default ceiling
# as if it were Axon's throughput. The default-configuration ceiling is reported
# separately as its own finding rather than discarded.
#
# initial-segment-count applies only when the token is first created; that is
# satisfied every run because the Axon Server event store is recreated and
# token_entry is truncated by the v0_clean seed step.
axon.eventhandling.processors.OrderFulfillmentSagaProcessor.mode=tracking
axon.eventhandling.processors.OrderFulfillmentSagaProcessor.thread-count=${EXERIS_AXON_SAGA_THREADS:16}
axon.eventhandling.processors.OrderFulfillmentSagaProcessor.initial-segment-count=${EXERIS_AXON_SAGA_SEGMENTS:16}
# Use Jackson (not XStream) for all Axon serializers — XStream cannot deserialize Java records on Java 26
axon.serializer.general=jackson
exeris.axon.mode=${EXERIS_AXON_MODE:event-sourcing-outbox}

# HTTP/2 — H2C (http://) or H2 (https:// + ssl)
# Enabled by harness when target-app label contains h2/h2c.
# Tomcat 11 serves H2C via upgrade or prior-knowledge when this is true.
server.http2.enabled=${EXERIS_HTTP2_ENABLED:false}

# TLS — PEM cert/key forwarded from EXERIS_TRANSPORT_CERT_PATH / EXERIS_TRANSPORT_KEY_PATH.
# server.ssl.enabled=false (default) disables the SSL connector; cert/key paths are ignored.
server.ssl.enabled=${EXERIS_SSL_ENABLED:false}
server.ssl.certificate=${EXERIS_TRANSPORT_CERT_PATH:}
server.ssl.certificate-private-key=${EXERIS_TRANSPORT_KEY_PATH:}
